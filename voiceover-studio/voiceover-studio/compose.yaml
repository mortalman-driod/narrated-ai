services:
  api:
    build:
      context: .
      args:
        ENGINE_EXTRAS: ${ENGINE_EXTRAS:-piper,queue}
    image: voiceover-studio:local
    ports:
      - "127.0.0.1:8000:8000"
    environment: &studio_environment
      STUDIO_DATA_DIR: /app/data
      STUDIO_QUEUE_MODE: celery
      STUDIO_DEVICE: ${STUDIO_DEVICE:-cpu}
      STUDIO_CPU_THREADS: ${STUDIO_CPU_THREADS:-4}
      REDIS_URL: redis://redis:6379/0
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  worker:
    image: voiceover-studio:local
    command: ["celery", "-A", "studio.tasks:celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    environment: *studio_environment
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  redis_data:
