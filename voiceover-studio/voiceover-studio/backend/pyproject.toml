[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceover-studio"
version = "0.1.0"
description = "Local speech production with FastAPI, Kokoro, Piper, and optional XTTS"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "numpy>=1.26,<3",
    "soundfile>=0.13,<1",
]

[project.optional-dependencies]
piper = ["piper-tts>=1.3,<2"]
kokoro = ["kokoro>=0.9.4,<0.10", "misaki[en]>=0.9.4,<0.10", "torch>=2.2,<3"]
xtts = ["coqui-tts>=0.27.5,<0.28", "torch>=2.2,<3", "torchaudio>=2.2,<3"]
queue = ["celery[redis]>=5.4,<6"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
